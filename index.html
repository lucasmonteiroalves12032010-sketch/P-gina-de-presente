
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uma história chamada Isabella</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="cabecalho">

        <img
            class="foto-perfil"

            alt="Foto da minha irmã"
        >

        <h1 class="nome">Vinício</h1>

    </header>


    <!-- BANNER INICIAL -->
    <section class="banner">

        <img
            class="banner-imagem"
            src="imagens/banner.png"
            alt="Uma lembrança especial"
        >

        <div class="banner-conteudo">

            <h2>Uma vida, tantas histórias...</h2>

            <p>
                Algumas histórias merecem ser lembradas
                para sempre. Esta é uma pequena parte
                de tudo que vivemos até aqui.
            </p>

        </div>

    </section>


    <!-- CORPO DA PÁGINA -->
    <main class="conteudo">

        <!--
        AQUI VOCÊ VAI ADICIONAR AS FOTOS,
        TEXTOS E MOMENTOS IMPORTANTES DA VIDA DELA.
        -->

    </main>


    <!-- RODAPÉ -->
    <footer class="rodape">

        <h2>Distância nenhuma apaga uma história.</h2>

        <p>
            Novos caminhos, novas experiências,
            mas as mesmas lembranças.
        </p>

        <p>Com carinho, Família Monteiro Alves.</p>

    </footer>
